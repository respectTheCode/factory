<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="plate"><rect width="128" height="128" rx="28"/></clipPath>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.87  0 0 0 0.09 0"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F2EA"/>
      <stop offset="1" stop-color="#CEC6B8"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B4B8E4"/>
      <stop offset="1" stop-color="#7F84B8"/>
    </linearGradient>
    <filter id="fShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="ledGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9499CB" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#141210"/>
  <rect width="128" height="128" clip-path="url(#plate)" filter="url(#grain)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="22" fill="none" stroke="#EAE6DF" stroke-opacity="0.1"/>
  <g filter="url(#fShadow)">
    <g fill="#8A8172">
      <rect x="34" y="31" width="60" height="14" rx="2.4"/>
      <rect x="34" y="31" width="12" height="72" rx="2.4"/>
      <rect x="34" y="61" width="36" height="14" rx="2.4"/>
    </g>
    <g fill="url(#bar)">
      <rect x="34" y="28" width="60" height="14" rx="2.4"/>
      <rect x="34" y="28" width="12" height="72" rx="2.4"/>
      <rect x="34" y="58" width="36" height="14" rx="2.4"/>
    </g>
  </g>
  <rect x="80" y="58" width="14" height="14" rx="4" fill="url(#led)" filter="url(#ledGlow)"/>
</svg>
