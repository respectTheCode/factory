# ST-162 synthetic packaging test. Do not point production clients here.
x-factory-image: &factory-image
  image: factory-pilot:current
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
    args:
      FACTORY_REVISION: ${FACTORY_REVISION:-}

services:
  tailscale:
    image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    hostname: factory-pilot
    environment:
      TS_HOSTNAME: factory-pilot
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 1h
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ../files/tailscale:/config:ro
    ports:
      - "${FACTORY_BIND_IP:?Set the private LAN address}:${FACTORY_PUBLIC_PORT:-3101}:3000"
    restart: unless-stopped

  factory:
    <<: *factory-image
    init: true
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
    environment:
      FACTORY_ENVIRONMENT: pilot
      FACTORY_HOST: 0.0.0.0
      FACTORY_PORT: "3000"
      FACTORY_DB: /data/factory.sqlite
      FACTORY_REQUIRE_EXISTING_DB: "true"
      FACTORY_OPERATOR_NAME: kevin-pilot
      FACTORY_OPERATOR_SECRET_FILE: /run/secrets/factory_operator
      FACTORY_ALLOWED_ORIGINS: ${FACTORY_ALLOWED_ORIGINS:-}
    volumes:
      - factory-data:/data
      - ../files/secrets/operator-secret:/run/secrets/factory_operator:ro
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first

  # Explicit, one-time command only. Refuses an existing database or token.
  # docker compose -f compose.pilot.yaml run --rm --build pilot-init
  pilot-init:
    <<: *factory-image
    profiles: [bootstrap]
    network_mode: none
    entrypoint: [bun, scripts/init-pilot.ts]
    command: [--database, /data/factory.sqlite]
    environment:
      FACTORY_ENVIRONMENT: pilot
    volumes:
      - factory-data:/data
    restart: "no"

volumes:
  factory-data:
    name: factory-pilot-st162-data
  tailscale-state:
